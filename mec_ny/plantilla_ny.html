<title>Sesión NY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
__ESTILO__
__ESTILO_HIBRIDA__
<style>
/* Sesión NY: mismo sistema visual que Gestión Híbrida; color por índice */
:root{--a-nas:#6a4fc4;--a-spx:#2a78d6;--a-dji:#1baf7a;--a-bny:#b13f8c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--a-nas:#9a7fe8;--a-spx:#3987e5;--a-dji:#199e70;--a-bny:#d064ad}}
:root[data-theme="dark"]{--a-nas:#9a7fe8;--a-spx:#3987e5;--a-dji:#199e70;--a-bny:#d064ad}
.dec{font:600 11px var(--f-mono);padding:2px 6px;border-radius:3px;white-space:nowrap}
.dec.operar{background:var(--gain-soft);color:var(--gain)} .dec.no{background:var(--loss-soft);color:var(--loss)} .dec.neutral,.dec.sin{border:1px solid var(--line);color:var(--fg3)}
</style>

<div class="wrap">
<header>
  <span class="eyebrow">Índices y BTCUSD · M1 · Sesión NY 09:00–11:00 NY · Sistema MEC</span>
  <h1>Sesión NY</h1>
  <div class="meta">
    <span>Período <b id="m-period"></b></span>
    <span>Capital inicial <b>1.000 USD</b></span>
    <span>Riesgo <b>1% por operación</b> (normalizado)</span>
    <span>1R = 1 TP = <b>0,9% del capital</b></span>
    <span>Límite por sesión <b>1 TP o 2 pérdidas</b></span>
  </div>
  <div class="meta"><span class="chip">Inicio de sesión: 09:00 o 09:30</span><span class="chip" id="m-activos"></span></div>
</header>

<nav class="tabs" role="tablist" aria-label="Activos" id="tabs"></nav>
<div id="vistas"></div>
<p class="note" id="fuente"></p>
</div>

<template id="tpl-activo">
<div class="view" role="tabpanel">
  <div class="view-head"><span class="eyebrow" data-f="eyebrow"></span><h2 data-f="titulo"></h2><p data-f="sub"></p></div>
  <div class="verdict" data-f="verdict"></div>
  <div class="kpis" data-f="kpis"></div>
  <section>
    <div class="sec-head"><h2>Inicio 09:00 contra 09:30, por patrón</h2><p>R = suma de resultados en múltiplos de 1 TP · riesgo normalizado a 1%</p></div>
    <div class="panel tbl"><table class="cmp" data-f="t-var"></table><p class="note">“Todos los días”: aplicando solo los días sin operar (feriados, receso, discursos de 09:00 a 11:00) y el bloqueo de 09:50 a 10:03. “Sin días de noticia ni FOMC”: además saca los días de NFP, CPI, PPI, PIB final y FOMC, que se analizan abajo.</p></div>
  </section>
  <section>
    <div class="sec-head"><h2>¿Conviene operar después de una noticia de alto impacto o en día de FOMC?</h2><p data-f="cat-p"></p></div>
    <div class="grid2">
      <div class="panel tbl"><h3>Por tipo de evento</h3><table class="cmp" data-f="t-cat"></table><p class="note">Operar: gana en 2025 y en 2026. No operar: pierde en el total. Neutral: gana en el total pero no en los dos años. Las muestras por evento son chicas: decidir por grupo (noticias, FOMC) y no evento por evento.</p></div>
      <div class="panel tbl"><h3>Por grupo y por variante</h3><table class="cmp" data-f="t-grp"></table></div>
    </div>
  </section>
  <section>
    <div class="sec-head"><h2>Franja horaria</h2><p data-f="fr-p"></p></div>
    <div class="grid2">
      <div class="panel tbl"><h3>Por franja de entrada</h3><table class="cmp" data-f="t-fr"></table></div>
      <div class="panel tbl"><h3>Sin entradas de 10:00 a 10:29, en todas las variantes</h3><table class="cmp" data-f="t-f10"></table><p class="note" data-f="f10-n"></p></div>
    </div>
  </section>
  <section>
    <div class="sec-head"><h2>Curva de capital</h2><p data-f="cv-p"></p></div>
    <div class="panel"><div class="legend" data-f="cv-leg"></div><div class="chart" data-f="c-cv"></div></div>
  </section>
  <section>
    <div class="sec-head"><h2>Resultado mensual</h2><p>R por mes · variante elegida, días sin noticia ni FOMC</p></div>
    <div class="panel"><div class="chart" data-f="c-mes"></div></div>
  </section>
  <section>
    <div class="sec-head"><h2>Días, dirección y salidas</h2><p>Variante elegida, días sin noticia ni FOMC</p></div>
    <div class="grid3">
      <div class="panel tbl"><h3>Día de la semana</h3><table class="cmp" data-f="t-dia"></table></div>
      <div class="panel tbl"><h3>Dirección</h3><table class="cmp" data-f="t-dir"></table><h3>Motivo de salida</h3><table class="cmp" data-f="t-sal"></table></div>
      <div class="panel tbl"><h3>Tras perder la 1.ª operación de la sesión</h3><table class="cmp" data-f="t-psl"></table><p class="note">Siguientes = operaciones de la misma sesión después de la primera.</p></div>
    </div>
  </section>
  <section>
    <div class="sec-head"><h2>¿Suma a la cartera de Pre NY?</h2><p>Gestión ganadora de Pre NY + este activo en NY · sin viernes · freno de pérdida semanal −3R · 1.000 simulaciones</p></div>
    <div class="panel tbl"><table class="cmp" data-f="t-cart"></table><p class="note" data-f="cart-n"></p></div>
    <div class="panel"><div class="legend" data-f="ct-leg"></div><div class="chart" data-f="c-ct"></div></div>
  </section>
  <section>
    <div class="sec-head"><h2>Operaciones excluidas por el calendario</h2><p>Variante elegida</p></div>
    <div class="panel tbl"><table class="cmp" data-f="t-exc"></table></div>
  </section>
</div>
</template>

<script>
const D = __DATA__;
__HELPERS__
const AN={NAS100:['US100 (NAS100)','--a-nas'],SPX500:['S&P 500','--a-spx'],US30:['Dow Jones (US30)','--a-dji'],BTCUSD_NY:['BTCUSD (NY)','--a-bny']};
const PATN={E:'Envolvente',S:'START',ES:'Envolvente + START'};
const DEC={operar:['operar','Operar'],'no operar':['no','No operar'],neutral:['neutral','Neutral'],'sin datos':['sin','Sin datos']};
const rr=(v,d=1)=>v==null?'—':sg(v,d);
const g5=(g)=>`${td(rr(g.R25),cls(g.R25))}${td(rr(g.R26),cls(g.R26))}${td(rr(g.R),cls(g.R))}`;
const both=g=>g.R25>0&&g.R26>0;
const MESN=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function renderActivo(a,root){
  const X=D.activos[a], E=X.elegida, V=X.variantes, ve=V.find(v=>v.inicio===E.inicio&&v.patron===E.patron), De=X.detalle, S=De.sim, mc=De.mc, f10=X.filtro10;
  const q=k=>root.querySelector(`[data-f="${k}"]`);
  const hora=E.inicio==='0900'?'09:00':'09:30', nom=AN[a][0];
  const c0=X.cartera[0], c1=X.cartera[1], c2=X.cartera[2];
  const suma=c=>c.anios['2025']>c0.anios['2025']&&c.anios['2026']>c0.anios['2026'], sube=c=>c.mdd>c0.mdd;
  q('eyebrow').textContent=`${nom} · sesión NY`;
  q('titulo').textContent=`${nom}: inicio ${hora}, ${PATN[E.patron]}`;
  q('sub').textContent=`La variante con mejor resultado entre las que ganan en los dos años, sin operar los días de noticia de alto impacto ni de FOMC. Cada operación se lleva a riesgo exacto de 1%: con 1.000 USD y lote mínimo de 0,1, el riesgo real de las operaciones del backtest fue de ${fmt(De.riesgo_real.min*100,0)}% a ${fmt(De.riesgo_real.max*100,0)}% del 1% (mediana ${fmt(De.riesgo_real.med*100,0)}%).`;
  const v09=V.filter(v=>v.inicio==='0900'), v93=V.filter(v=>v.inicio==='0930');
  const fr10=De.franjas.find(f=>f.franja.startsWith('10:00'));
  q('verdict').innerHTML=`<div class="big">${nom} tiene una ventaja chica: ${sg(ve.limpio.R)}R en ${ve.limpio.n} operaciones (${sg(ve.limpio.R_op,3)}R por operación). ${both(f10.sin)?`Sin entradas de 10:00 a 10:29 sube a ${sg(f10.sin.R)}R y gana en los dos años.`:''}</div>
  <p><b>Inicio</b>: arrancar a las 09:00 es mejor que a las 09:30 con los tres patrones (${v09.map(v=>`${PATN[v.patron]} ${sg(v.limpio.R)}R`).join(', ')} contra ${v93.map(v=>`${sg(v.limpio.R)}R`).join(', ')}). <b>Días de noticia y FOMC</b>: en la variante elegida restan ${sg(ve.noticia.R)}R y ${sg(ve.fomc.R)}R; sacarlos es lo que hace que gane en los dos años. <b>Franja de 10:00 a 10:29</b>: es la única que pierde en los dos años (${fmt(fr10.wr,0)}% de acierto, ${sg(fr10.R)}R), cuando salen los datos de las 10:00. <b>Riesgo</b>: solo, ${nom} cierra un año en pérdida en ${fmt(mc.p_anio_neg,0)}% de las simulaciones; ${both(f10.sin)?`con el filtro de 10:00, en ${fmt(f10.mc_sin.p_anio_neg,0)}%`:''}. <b>En la cartera</b>: sumado a Pre NY ${suma(c2)?'mejora los dos años':'no mejora los dos años'} (${pc(c2.anios['2025'])} y ${pc(c2.anios['2026'])} contra ${pc(c0.anios['2025'])} y ${pc(c0.anios['2026'])}) pero ${sube(c2)?`sube la caída máxima de −${fmt(c0.mdd)}% a −${fmt(c2.mdd)}%`:'no sube la caída'}: por la regla de siempre, ${suma(c2)&&!sube(c2)?'entra':'todavía no entra'}. Conviene esperar al S&P 500 y al Dow Jones para comparar.</p>`;
  const k=(l,v,s,c='',h='')=>`<div class="kpi${h}"><span class="l">${l}</span><span class="v ${c}">${v}</span><span class="s">${s}</span></div>`;
  q('kpis').innerHTML=k('R total (días sin noticia ni FOMC)',sg(ve.limpio.R)+'R',`2025 ${sg(ve.limpio.R25)}R · 2026 ${sg(ve.limpio.R26)}R`,cls(ve.limpio.R),' hero')+k('Win rate',fmt(ve.limpio.wr)+'%',`${ve.limpio.n} operaciones · racha máx. ${ve.limpio_res.racha}`)+k('Anual compuesto (solo)',pc(S.cagr),`caída máx. −${fmt(S.mdd)}%`,cls(S.cagr))+k('Peor 5% de simulaciones',pc(mc.cagr_p5),`año negativo en ${fmt(mc.p_anio_neg,0)}%`,cls(mc.cagr_p5));
  q('t-var').innerHTML=`<thead><tr><th>Inicio · patrón</th><th class="n">Ops.</th><th class="n">Win rate</th><th class="n">R 2025</th><th class="n">R 2026</th><th class="n">R total</th><th class="n">Ops.</th><th class="n">Win rate</th><th class="n">R 2025</th><th class="n">R 2026</th><th class="n">R total</th><th class="n">R por op.</th><th class="n">Dos años</th></tr><tr><th></th><th class="n" colspan="5">Todos los días</th><th class="n" colspan="7">Sin días de noticia ni FOMC</th></tr></thead>`+
    V.map(v=>{const el_=v===ve;return `<tr${el_?' class="best"':''}><td>${v.hora} · ${PATN[v.patron]}${el_?' <span class="pill g">elegida</span>':''}</td>${td(v.todos.n)}${td(fmt(v.todos.wr)+'%')}${g5(v.todos)}${td(v.limpio.n)}${td(fmt(v.limpio.wr)+'%')}${g5(v.limpio)}${td(rr(v.limpio.R_op,3),cls(v.limpio.R_op))}<td class="n">${pill(both(v.limpio))}</td></tr>`}).join('');
  q('cat-p').textContent=`Variante elegida (${hora} · ${PATN[E.patron]})`;
  const ch=`<thead><tr><th>Evento</th><th class="n">Ops.</th><th class="n">Win rate</th><th class="n">R 2025</th><th class="n">R 2026</th><th class="n">R total</th><th class="n">Decisión</th></tr></thead>`;
  q('t-cat').innerHTML=ch+['Noticia','FOMC'].map(gr=>`<tr class="grp"><td colspan="7">${gr==='Noticia'?'Días de noticia (sin operar en Pre NY)':'Días de FOMC (14:00)'}</td></tr>`+ve.categorias.filter(c=>c.grupo===gr).map(c=>`<tr><td>${c.cat}</td>${td(c.n)}${td(c.wr==null?'—':fmt(c.wr,0)+'%')}${g5(c)}<td class="n"><span class="dec ${DEC[c.decision][0]}">${DEC[c.decision][1]}</span></td></tr>`).join('')).join('');
  q('t-grp').innerHTML=`<thead><tr><th>Variante</th><th class="n">Noticia R</th><th class="n">FOMC R</th><th class="n">Ops. noticia</th><th class="n">Ops. FOMC</th></tr></thead>`+V.map(v=>`<tr${v===ve?' class="best"':''}><td>${v.hora} · ${PATN[v.patron]}</td>${td(rr(v.noticia.R),cls(v.noticia.R))}${td(rr(v.fomc.R),cls(v.fomc.R))}${td(v.noticia.n)}${td(v.fomc.n)}</tr>`).join('')+`<tr><td colspan="5" class="note">Los días de FOMC restan en las seis variantes y los de noticia en casi todas: se recomienda no operar NY esos días.</td></tr>`;
  q('fr-p').textContent=`Variante elegida, días sin noticia ni FOMC`;
  const fh=`<thead><tr><th>Franja</th><th class="n">Ops.</th><th class="n">Win rate</th><th class="n">R 2025</th><th class="n">R 2026</th><th class="n">R total</th></tr></thead>`;
  q('t-fr').innerHTML=fh+De.franjas.map(f=>`<tr${f.R25<0&&f.R26<0?' style="background:var(--loss-soft)"':''}><td>${f.franja}</td>${td(f.n)}${td(f.wr==null?'—':fmt(f.wr,0)+'%')}${g5(f)}</tr>`).join('');
  q('t-f10').innerHTML=`<thead><tr><th>Variante</th><th class="n">Con la franja</th><th class="n">Sin la franja</th><th class="n">R 2025</th><th class="n">R 2026</th><th class="n">Dos años</th></tr></thead>`+f10.por_variante.map(v=>`<tr${v.hora===ve.hora&&v.patron===ve.patron?' class="best"':''}><td>${v.hora} · ${PATN[v.patron]}</td>${td(rr(v.con.R),cls(v.con.R))}${td(rr(v.sin.R),cls(v.sin.R))}${td(rr(v.sin.R25),cls(v.sin.R25))}${td(rr(v.sin.R26),cls(v.sin.R26))}<td class="n">${pill(both(v.sin))}</td></tr>`).join('');
  const mejora=f10.por_variante.filter(v=>v.sin.R>v.con.R).length;
  q('f10-n').textContent=`Sacar las entradas de 10:00 a 10:29 mejora ${mejora} de las ${f10.por_variante.length} variantes. Tiene lógica de mercado (a las 10:00 salen ISM, JOLTS, confianza del consumidor, ventas de viviendas y otros datos, y el bloqueo de 09:50 a 10:03 no cubre la reacción posterior), pero es un filtro encontrado mirando estos datos: tomarlo como candidato y confirmarlo con el S&P 500 y el Dow Jones antes de adoptarlo. En la variante elegida, el peor 5% de las simulaciones pasa de ${pc(f10.mc_con.cagr_p5)} a ${pc(f10.mc_sin.cagr_p5)} anual.`;
  q('cv-p').textContent=`Variante elegida, días sin noticia ni FOMC · 1.000 USD iniciales · riesgo 1%`;
  const sers=[{name:'Sin noticia ni FOMC',color:AN[a][1],pts:S.curve,w:2.2}];
  q('cv-leg').innerHTML=sers.map(s=>`<span><i style="background:var(${s.color})"></i>${s.name} · ${pc(S.ret)}</span>`).join('');
  lineChart(q('c-cv'),sers,280);
  barChart(q('c-mes'),De.meses.map(m=>{const [y,mm]=m.mes.split('-');return {v:m.R,label:MESN[+mm-1]+(mm==='01'?' '+y.slice(2):''),title:MESN[+mm-1]+' '+y,extra:` · ${m.n} ops.`}}),220,'R');
  const sh=`<thead><tr><th></th><th class="n">Ops.</th><th class="n">Win rate</th><th class="n">R 2025</th><th class="n">R 2026</th><th class="n">R</th></tr></thead>`;
  q('t-dia').innerHTML=sh+De.dias.map(x=>`<tr><td>${x.dia}</td>${td(x.n)}${td(x.wr==null?'—':fmt(x.wr,0)+'%')}${g5(x)}</tr>`).join('');
  q('t-dir').innerHTML=sh+De.direccion.map(x=>`<tr><td>${x.dir==='BUY'?'Compras':'Ventas'}</td>${td(x.n)}${td(fmt(x.wr,0)+'%')}${g5(x)}</tr>`).join('');
  q('t-sal').innerHTML=sh+De.salidas.map(x=>`<tr><td>${x.salida.replace('Salida Pre NY / NY (SL o TP)','SL o TP de precio')}</td>${td(x.n)}${td(fmt(x.wr,0)+'%')}${g5(x)}</tr>`).join('');
  const ps=De.primer_sl;
  q('t-psl').innerHTML=`<thead><tr><th>Cierre de la 1.ª</th><th class="n">Sesiones</th><th class="n">Siguientes</th><th class="n">Win rate</th><th class="n">R</th></tr></thead>`+ps.motivos.map(m=>`<tr${m.motivo==='Todas'?' class="best"':''}><td>${m.motivo.replace('Salida Pre NY / NY (SL o TP)','SL de precio')}</td>${td(m.dias)}${td(m.ops)}${td(m.wr==null?'—':fmt(m.wr,0)+'%')}${td(m.ops?sg(m.R):'—',cls(m.R))}</tr>`).join('');
  q('t-cart').innerHTML=`<thead><tr><th>Cartera</th><th class="n">Ops.</th><th class="n">Win rate</th><th class="n">2025</th><th class="n">2026</th><th class="n">Anual comp.</th><th class="n">Mensual comp.</th><th class="n">Caída máx.</th><th class="n">Peor 5% sim.</th><th class="n">Caída peor 5%</th><th class="n">Año negativo</th></tr></thead>`+
    X.cartera.map((c,i)=>`<tr${i===0?' class="best"':''}><td>${c.nombre}</td>${td(c.n)}${td(fmt(c.wr)+'%')}${td(pc(c.anios['2025']),i&&c.anios['2025']<=c0.anios['2025']?'neg':cls(c.anios['2025']))}${td(pc(c.anios['2026']),i&&c.anios['2026']<=c0.anios['2026']?'neg':cls(c.anios['2026']))}${tdp(c.cagr)}${td(pc(c.mes_geo,2),cls(c.mes_geo))}${td('−'+fmt(c.mdd)+'%',i&&c.mdd>c0.mdd?'neg':'')}${tdp(c.mc.cagr_p5)}${td('−'+fmt(c.mc.dd_p95)+'%')}${td(fmt(c.mc.p_anio_neg,1)+'%')}</tr>`).join('');
  q('cart-n').textContent=`Regla de siempre: un activo entra si mejora los dos años sin subir la caída máxima. ${nom} sube el rendimiento ${suma(c2)?'en los dos años':''} pero la caída máxima pasa de −${fmt(c0.mdd)}% a −${fmt(c2.mdd)}%${c2.mc.cagr_p5>c0.mc.cagr_p5?` (aunque el peor 5% de las simulaciones mejora de ${pc(c0.mc.cagr_p5)} a ${pc(c2.mc.cagr_p5)})`:''}. Queda como candidato hasta ver los demás índices.`;
  const cc=['--fg3',AN[a][1],'--gain'];
  const sc=X.cartera.map((c,i)=>({name:c.nombre,color:cc[i],pts:c.curve,w:i===2?2.2:1.6}));
  q('ct-leg').innerHTML=sc.map(s=>`<span><i style="background:var(${s.color})"></i>${s.name}</span>`).join('');
  lineChart(q('c-ct'),sc,280);
  q('t-exc').innerHTML=`<thead><tr><th>Motivo</th><th class="n">Ops.</th><th class="n">Win rate</th><th class="n">R 2025</th><th class="n">R 2026</th><th class="n">R total</th></tr></thead>`+ve.excluidas.map(x=>`<tr><td>${x.cat}</td>${td(x.n)}${td(x.wr==null?'—':fmt(x.wr,0)+'%')}${g5(x)}</tr>`).join('');
}

const tabs=$('#tabs'), vistas=$('#vistas'); let VIEW=null; const pend={};
D.meta.activos.forEach(a=>{
  const b=document.createElement('button');b.setAttribute('role','tab');b.dataset.k=a;b.textContent=AN[a][0];tabs.appendChild(b);
  const v=$('#tpl-activo').content.firstElementChild.cloneNode(true);v.id='v-'+a;v.hidden=true;vistas.appendChild(v);
});
function show(k){VIEW=k;tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));vistas.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='v-'+k);renderActivo(k,$('#v-'+k));try{history.replaceState(null,'','#'+k)}catch(e){}}
tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{show(b.dataset.k);window.scrollTo({top:0})});
$('#m-period').textContent=`${D.meta.ini} al ${D.meta.fin}`;
$('#m-activos').textContent=`Activos analizados: ${D.meta.activos.map(a=>AN[a][0]).join(', ')} · S&P 500, Dow Jones y BTCUSD en camino`;
const C_=D.meta.calendario;
$('#fuente').textContent=`Fuente: listas de operaciones del Strategy Tester de TradingView (sesión NY desde las 09:00 y desde las 09:30, hasta las 11:00), horario de Nueva York, 2025-2026. Calendario NY: ${C_.SIN_OPERAR} días sin operar (feriados, receso de fin de año, discursos de 09:00 a 11:00), bloqueo de 09:50 a 10:03 por ISM, JOLTS, CB Consumer Confidence y Core PCE (${C_.BLOQUEO_NOTICIA} entradas), y ${C_.ANALIZAR_NOTICIA} días de noticia y ${C_.ANALIZAR_FOMC} de FOMC analizados aparte. Una pérdida por Reset cuenta como SL: tras dos pérdidas no se abre otra operación. Riesgo normalizado a 1% por operación (SL −1, TP +0,9; otras salidas, riesgo estimado con el tamaño). Cartera Pre NY: XAUUSD Envolvente, EURUSD Envolvente + START, GBPUSD START y BTCUSD Envolvente, sin viernes y con freno semanal de −3R.`;
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>VIEW&&renderActivo(VIEW,$('#v-'+VIEW)),200)});
show(D.meta.activos.includes((location.hash||'').slice(1))?location.hash.slice(1):D.meta.activos[0]);
</script>
